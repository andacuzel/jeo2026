<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kriz Masası 2026 | Komuta Merkezi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { background-color: #020617; color: #cbd5e1; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        #map { height: 350px; width: 100%; border-radius: 0.5rem; border: 1px solid #334155; z-index: 1; }
        .leaflet-layer { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        .loader { border-top-color: #06b6d4; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-6 flex flex-col h-screen gap-4">

    <!-- Üst Bar: API Key ve Durum -->
    <div class="flex justify-between items-center bg-slate-900 p-4 border border-slate-800 rounded">
        <h1 class="text-xl font-bold text-cyan-500 tracking-widest">KRİZ MASASI SİMÜLASYONU</h1>
        <div class="flex gap-4 items-center">
            <input type="password" id="apiKey" placeholder="Gemini API Key Girin" class="bg-slate-950 border border-slate-700 rounded p-1 text-sm text-cyan-300 focus:outline-none focus:border-cyan-500 w-64">
            <span id="turnCounter" class="text-slate-400">Yıl: 2026 | Tur: 1</span>
        </div>
    </div>

    <div class="flex flex-col md:flex-row gap-6 flex-1 overflow-hidden">
        <!-- SOL PANEL: Harita ve Oyun Günlüğü -->
        <div class="w-full md:w-2/3 flex flex-col gap-4 h-full">
            <div id="map" class="shrink-0"></div>

            <div class="bg-slate-900 border border-slate-800 rounded p-4 flex-1 overflow-y-auto flex flex-col">
                <h2 class="text-cyan-500 font-bold mb-2 border-b border-slate-800 pb-2">GM SİSTEM GÜNLÜĞÜ</h2>
                <div id="narrativeLog" class="text-sm text-slate-300 space-y-4">
                    <p><span class="text-red-500 font-bold">[KRİZ]</span> Doğu Akdeniz'de Avrupa destekli GKRY sondaj gemisi tartışmalı sulara girdi. İlk hamle bekleniyor...</p>
                </div>
                
                <!-- Yükleniyor Animasyonu -->
                <div id="loading" class="hidden mt-4 flex items-center gap-3 text-cyan-500 text-sm">
                    <div class="loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-5 w-5"></div>
                    GM Sonuçları Hesaplanıyor...
                </div>
            </div>
        </div>

        <!-- SAĞ PANEL: Emirler ve İstatistikler -->
        <div class="w-full md:w-1/3 flex flex-col gap-4 overflow-y-auto">
            
            <!-- İstatistikler -->
            <div class="bg-slate-900 border border-slate-800 rounded p-4">
                <h2 class="text-emerald-500 font-bold mb-4 border-b border-slate-800 pb-2">TÜRKİYE BİLANÇOSU</h2>
                <div class="space-y-4 text-sm font-bold" id="statsPanel">
                    <!-- JS ile güncellenecek -->
                </div>
            </div>

            <!-- Emir Formu -->
            <div class="bg-slate-900 border border-slate-800 rounded p-4 flex flex-col gap-3">
                <h2 class="text-cyan-500 font-bold mb-2 border-b border-slate-800 pb-2">EMİR GİRİŞİ</h2>
                <input type="text" id="m1" placeholder="Açık Hamle 1 (Örn: Donanmayı yolla)" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm text-cyan-300 focus:outline-none">
                <input type="text" id="m2" placeholder="Açık Hamle 2" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm text-cyan-300 focus:outline-none">
                <input type="text" id="m3" placeholder="Açık Hamle 3" class="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm text-cyan-300 focus:outline-none">
                
                <label class="block text-xs text-fuchsia-500 mt-2 font-bold tracking-wider">GİZLİ OPERASYON</label>
                <textarea id="covert" rows="2" placeholder="Siber saldırı, istihbarat vb..." class="w-full bg-slate-950 border border-fuchsia-900/50 rounded p-2 text-sm text-fuchsia-300 focus:outline-none"></textarea>

                <button onclick="executeTurn()" class="mt-2 w-full bg-cyan-900 hover:bg-cyan-800 text-cyan-100 font-bold py-3 rounded border border-cyan-700">
                    TURU BAŞLAT
                </button>
            </div>
        </div>
    </div>

    <script>
        // Oyun Durumu
        let gameState = {
            turn: 1,
            stats: { military: 80, diplomacy: 65, stability: 45, economy: 35 },
            activeCrisis: "Doğu Akdeniz Sondaj Krizi"
        };

        // Harita Kurulumu
        const map = L.map('map').setView([35.0, 33.0], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let crisisMarker = L.marker([34.5, 33.5]).addTo(map).bindPopup('Aktif Kriz');

        // İstatistikleri Ekrana Çizme
        function renderStats() {
            const html = Object.entries(gameState.stats).map(([key, val]) => `
                <div>
                    <div class="flex justify-between mb-1 uppercase text-xs text-slate-400"><span>${key}</span><span class="text-white">${val}/100</span></div>
                    <div class="w-full bg-slate-950 rounded h-1.5"><div class="bg-cyan-500 h-1.5 rounded transition-all duration-1000" style="width: ${val}%"></div></div>
                </div>
            `).join('');
            document.getElementById('statsPanel').innerHTML = html;
        }
        renderStats();

        // Gemini API'ye İstek Atma
        async function executeTurn() {
            const apiKey = document.getElementById('apiKey').value;
            if(!apiKey) return alert("Lütfen sağ üste Gemini API anahtarınızı girin.");

            const moves = [
                document.getElementById('m1').value, document.getElementById('m2').value,
                document.getElementById('m3').value, document.getElementById('covert').value
            ].filter(m => m.trim() !== "");

            if(moves.length === 0) return alert("En az bir hamle girmelisin.");

            // Arayüzü Yükleniyor Moduna Al
            document.getElementById('loading').classList.remove('hidden');
            const logDiv = document.getElementById('narrativeLog');

            const prompt = `Sen Kriz Masası 2026 jeopolitik oyununun GM'isin. 
            Mevcut Durum: ${JSON.stringify(gameState)}
            Oyuncunun (Türkiye) Hamleleri: ${JSON.stringify(moves)}
            
            Zarları at ve sonuçları hesapla. 
            DÖNÜŞ FORMATIN SADECE VE KESİNLİKLE GEÇERLİ BİR JSON OLMALIDIR. Markdown (\`\`\`json) KULLANMA.
            Şu formatta dön:
            {
                "narrative": "Sonuçların epik ve jeopolitik anlatımı (HTML formatında, paragraflarla)",
                "newCrisis": "Bir sonraki turun krizi (kısa isim)",
                "crisisCoords": [lat, lng],
                "newStats": { "military": num, "diplomacy": num, "stability": num, "economy": num }
            }`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                safetySettings: [
                    { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                ]
            };

            try {
                // Model isimlendirmesi güncellendi (gemini-1.5-flash-latest)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                // HTTP seviyesinde hata kontrolü
                if (!response.ok) {
                    throw new Error(`Google API Hatası: ${data.error?.message || response.statusText}`);
                }

                // Güvenlik filtresi kontrolü
                if (!data.candidates || data.candidates.length === 0) {
                    throw new Error(`İçerik engellendi. Sebep: ${data.promptFeedback?.blockReason || 'Bilinmeyen Güvenlik Filtresi'}`);
                }

                let resultText = data.candidates[0].content.parts[0].text;
                
                // JSON temizleme (Markdown formatını düz metne çevirme)
                resultText = resultText.replace(/```json/g, '').replace(/```/g, '').trim();
                const result = JSON.parse(resultText);

                // State Güncelleme
                gameState.stats = result.newStats;
                gameState.activeCrisis = result.newCrisis;
                gameState.turn += 1;

                // Arayüz Güncelleme
                renderStats();
                document.getElementById('turnCounter').innerText = `Yıl: 2026 | Tur: ${gameState.turn}`;
                logDiv.innerHTML += `<div class="mt-4 pt-4 border-t border-slate-700">
                    <span class="text-emerald-500 font-bold">[TUR ${gameState.turn - 1} SONUÇLARI]</span><br>
                    ${result.narrative}
                </div>`;
                
                // Haritada yeni krizi işaretleme
                crisisMarker.setLatLng(result.crisisCoords).bindPopup(result.newCrisis).openPopup();
                map.flyTo(result.crisisCoords, 5);

                // Form Temizliği
                ['m1', 'm2', 'm3', 'covert'].forEach(id => document.getElementById(id).value = '');

            } catch (error) {
                // Hatayı doğrudan ekrana yazdır
                logDiv.innerHTML += `<div class="mt-4 pt-4 border-t border-red-900">
                    <p class="text-red-500 font-bold">[SİSTEM HATASI]</p>
                    <p class="text-slate-400">${error.message}</p>
                </div>`;
            } finally {
                document.getElementById('loading').classList.add('hidden');
                logDiv.scrollTop = logDiv.scrollHeight;
            }
        }
    </script>
</body>
</html>
